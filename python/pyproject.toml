[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingolix"
dynamic = ["version"]
description = "Python client for the Lingolix pronunciation scoring API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lingolix", email = "info@lingolix.com" }]
keywords = ["pronunciation", "speech", "language-learning", "ipa", "phonetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://lingolix.com"
Documentation = "https://lingolix.com/api-portal/docs"
Source = "https://github.com/lingolix/lingolix-sdk"
Issues = "https://github.com/lingolix/lingolix-sdk/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.version]
path = "src/lingolix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lingolix"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
