# Tag py-v0.1.0 to publish the Python package, ts-v0.1.0 for the npm package.
# Both use trusted publishing (OIDC) — no tokens in repository secrets.
name: Release

on:
  push:
    tags: ["py-v*", "ts-v*"]

jobs:
  pypi:
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A wrong version number can never be un-published from PyPI, so refuse
      # to build unless the tag and __version__ agree.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          pkg="$(uv run python -c 'import lingolix; print(lingolix.__version__)')"
          test "$tag" = "$pkg" || { echo "tag $tag != __version__ $pkg"; exit 1; }
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#ts-v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - run: npm ci
      - run: npm test
      # npm answers an unauthenticated or under-privileged publish with a bare
      # 404 on the PUT, which reads like a missing package. Fail here instead,
      # where the cause is legible. Neither command echoes the token.
      - name: Check npm auth
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN secret is empty or unset"; exit 1; }
          echo "authenticated as: $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
        env:
          # setup-node writes an .npmrc referencing ${NODE_AUTH_TOKEN}; npm expands
          # it at publish time, so the variable must have exactly this name.
          #
          # TEMPORARY: only needed because npm trusted publishing can't be set up
          # for a package name that doesn't exist yet. Once @lingolix/sdk is on the
          # registry, configure trusted publishing on its npm settings page, then
          # delete this env block and the NPM_TOKEN secret. Until then an expired
          # token fails here as a bare "E401 Unable to authenticate".
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
