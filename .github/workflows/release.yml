# Tag py-v0.1.0 to publish the Python package, ts-v0.1.0 for the npm package.
# Both use trusted publishing (OIDC) — no tokens in repository secrets.
name: Release

on:
  push:
    tags: ["py-v*", "ts-v*"]

jobs:
  pypi:
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # A wrong version number can never be un-published from PyPI, so refuse
      # to build unless the tag and __version__ agree.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          pkg="$(uv run python -c 'import lingolix; print(lingolix.__version__)')"
          test "$tag" = "$pkg" || { echo "tag $tag != __version__ $pkg"; exit 1; }
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#ts-v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
